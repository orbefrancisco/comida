<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Comida</title>
<link rel="icon" href="icono-192.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#111813">
<meta name="robots" content="noindex, nofollow">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Comida: misma paleta que el Plan de comidas semanal (verde hoja, ámbar para avisos). */
:root{
  --bg:#f3f6f1; --surface:#ffffff; --ink:#18241c; --muted:#56645a; --line:#d9e2da;
  --accent:#1f6f4a; --accent-soft:#e2efe7; --on-accent:#ffffff; --sun:#9a6a00; --water:#2b5fa8; --ent:#b3172c;
  --display:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#111813; --surface:#19221c; --ink:#e6eee8; --muted:#9bab9f; --line:#2b372f;
  --accent:#5cc28f; --accent-soft:#1f3328; --on-accent:#0d1610; --sun:#e9b94a; --water:#7fa8e8; --ent:#f0435a; color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg)}
body{color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent}
main{max-width:520px;margin:0 auto;padding:max(14px,env(safe-area-inset-top,0px)) 16px calc(96px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px}
header{display:flex;justify-content:space-between;align-items:baseline}
h1,h2,h3{font-family:var(--display);margin:0;letter-spacing:-.01em}
h1{font-size:30px;font-weight:700}
h2{font-size:18px;font-weight:700}
.fecha{margin:0;color:var(--muted);text-transform:capitalize}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px}
.fila{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.grande{font-family:var(--display);font-weight:700;font-size:28px;font-variant-numeric:tabular-nums}
.grande small{font-size:15px;color:var(--muted);font-weight:500}
.muted{color:var(--muted)} .peq{font-size:13px} p{margin:0}
.track{height:12px;border-radius:6px;background:var(--line);overflow:hidden}
.fill{height:100%;background:var(--accent);border-radius:6px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:1px solid var(--line);border-radius:12px;min-height:44px;padding:0 14px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:6px}
button svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
button.prim{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
button.ancho{width:100%;min-height:52px;font-size:16px}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
input,select,textarea{width:100%;border:1px solid var(--line);border-radius:10px;background:var(--bg);padding:10px;min-height:44px}
textarea{resize:vertical;font-size:16px}
.lbl{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted);font-weight:600}
.inline{display:flex;flex-direction:column;gap:6px;font-size:14px}
.acc{display:flex;gap:8px;flex-wrap:wrap} .acc>*{flex:1}
.dos{display:grid;grid-template-columns:1fr 1fr;gap:8px;align-items:end}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{min-height:38px;border-radius:999px;font-weight:500;font-size:14px;background:var(--bg)}
.chip.sel{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.vasos{display:flex;flex-wrap:wrap;gap:4px}
.vaso{min-height:44px;width:40px;padding:0;border-color:transparent;color:var(--line)}
.vaso svg{width:26px;height:26px;stroke:var(--water);fill:none}
.vaso.on svg{fill:var(--water)}
.linea,.previa,.compra{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.linea li,.previa li{display:grid;grid-template-columns:auto 1fr auto auto;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.previa li{grid-template-columns:1fr auto auto auto}
.previa li.nr{grid-template-columns:1fr auto}
.hora{font-variant-numeric:tabular-nums;font-weight:600}
.cuerpo{display:flex;flex-direction:column;gap:2px;min-width:0}
.etq{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
.prot{font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.x{min-height:40px;min-width:40px;padding:0 8px;border-color:transparent;color:var(--muted);font-size:18px}
.paso{display:flex;gap:4px}
.paso button{min-width:40px;padding:0}
.mini{width:64px;height:64px;object-fit:cover;border-radius:8px;margin-top:4px}
.fotoBox{position:relative;width:100%;max-width:260px}
.fotoBox img{width:100%;border-radius:12px;display:block}
.fotoBox .x{position:absolute;top:4px;right:4px;background:var(--surface)}
.total{font-size:15px}
#codigoCaja video{width:100%;border-radius:12px;background:#000;max-height:260px;object-fit:cover}
.pl{display:grid;grid-template-columns:76px 1fr auto;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.ok{color:var(--accent);font-weight:600;white-space:nowrap}
.semana{display:grid;grid-template-columns:1fr;gap:10px}
.dia{border:1px solid var(--line);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:6px}
.dia.hoy{border-color:var(--accent)}
.dia label{display:flex;flex-direction:column;gap:2px;color:var(--muted)}
.dia select{min-height:40px;padding:6px 8px;font-size:14px}
.cat{font:600 12px var(--body);text-transform:uppercase;letter-spacing:.08em;color:var(--accent);margin-top:6px}
.compra label{display:grid;grid-template-columns:24px 1fr auto;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line)}
.compra input{width:20px;min-height:20px;accent-color:var(--accent)}
.compra li.hecho span{text-decoration:line-through;color:var(--muted)}
.grafica{position:relative;height:160px;display:grid;grid-template-columns:repeat(7,1fr);gap:6px;align-items:end;border-bottom:1px solid var(--line);padding-top:18px}
.col{height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:2px}
.col .v{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.col .b{width:70%;background:var(--accent-soft);border:1px solid var(--accent);border-radius:6px 6px 0 0;min-height:2px}
.col .b.ok{background:var(--accent)}
.meta{position:absolute;left:0;right:0;border-top:2px dashed var(--sun)}
.meta span{position:absolute;right:0;top:-18px;font-size:11px;color:var(--sun);font-weight:600}
.ejes{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;text-align:center;font-size:12px;color:var(--muted);text-transform:capitalize}
.ejes span{display:flex;flex-direction:column;align-items:center;gap:3px}
i.ent{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--ent)}
.ejes i:not(.ent){display:inline-block;width:8px;height:8px}
i.leyenda{vertical-align:middle;margin-right:4px}
#aviso{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:500;max-width:90vw;z-index:5}
nav{position:fixed;left:0;right:0;bottom:0;display:grid;grid-template-columns:repeat(4,1fr);gap:4px;padding:6px 8px calc(8px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);background:var(--surface)}
nav button{border:0;min-height:54px;flex-direction:column;gap:2px;font-size:12px;font-weight:500;color:var(--muted);border-radius:12px;padding:0}
nav button[aria-current="page"]{background:var(--accent-soft);color:var(--accent)}
nav svg{width:22px;height:22px}
</style>
</head>
<body>
<main>
  <header><h1>Comida</h1></header>
  <div id="vista" aria-live="polite"></div>
</main>
<input id="fotoInput" type="file" accept="image/*" capture="environment" hidden>
<input id="importInput" type="file" accept=".json,application/json" hidden>
<div id="aviso" role="status" hidden></div>
<nav aria-label="Secciones">
  <button data-tab="hoy" aria-current="page"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8"/><path d="M12 8v4l3 2"/></svg>Hoy</button>
  <button data-tab="agregar"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>Agregar</button>
  <button data-tab="plan"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M9 3v4M15 3v4"/></svg>Plan</button>
  <button data-tab="semana"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 19V11M10 19V6M15 19v-5M20 19V9"/></svg>Semana</button>
</nav>
<script src="datos.js"></script>
<script src="app.js"></script>
</body>
</html>
